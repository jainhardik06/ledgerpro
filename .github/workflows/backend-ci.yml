name: Backend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality-gate:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Run API Tests (Bruno)
        run: |
          npm run start &
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health; then
              echo "Next.js server is up and healthy!"
              break
            fi
            echo "Waiting for Next.js server to start..."
            sleep 1
          done
          npm run test:api
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  security-gate:
    name: Security & Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
