url: "http://localhost:3000/login"
env:
  USERNAME: "user@example.com"
  PASSWORD: "password"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- runFlow:
    file: ../subflows/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
- runFlow: ../subflows/logout.yaml
