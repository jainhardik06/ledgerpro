url: "http://localhost:3000/login"
env:
  USERNAME: "user@example.com"
  PASSWORD: "password"
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
- assertVisible: "Total Cash"
- assertVisible: "Operating Profit (MTD)"
- assertVisible: "30-Day Trajectory"
- assertVisible: "Command Center"
- tapOn: "Transactions"
- assertVisible: "Transactions"
- tapOn: "Command Center"
