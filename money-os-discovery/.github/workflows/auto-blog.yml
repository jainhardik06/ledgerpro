name: Auto Blog (Money OS Discovery)

# Publishes one new blog post roughly every 3 days via the Content Engine.
# GitHub cron has no native "every 3 days", so we run on days 1,4,7,…,28 at
# 09:00 UTC — an even ~3-day cadence that resets cleanly each month.
#
# Generation is deliberately paced against Groq's free-tier rate limits (see
# scripts/lib/rate-limit.mjs) — a single run takes a few minutes, not seconds.
# That's fine: there is no time pressure on a ~3-day publishing cadence.
on:
  schedule:
    - cron: '0 9 1,4,7,10,13,16,19,22,25,28 * *'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# The workflow commits the generated MDX back to this repo.
permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          MONGODB_GROWTH_URI: ${{ secrets.MONGODB_GROWTH_URI }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        run: npm run content:generate

      - name: Commit & push new post
        run: |
          if [ -z "$(git status --porcelain src/content/blog)" ]; then
            echo "No new post was generated; nothing to commit."
            exit 0
          fi
          # Vercel only auto-deploys production pushes whose commit author is a
          # recognized account on the project — a commit authored as a generic
          # bot identity (money-os-content-bot) gets silently skipped for
          # deployment even though the git push itself succeeds. Using the
          # real authorized account here is required for CI-published posts
          # to actually go live, not just land in the repo.
          git config user.name  "jainhardik06"
          git config user.email "2023pietcshardik060@poornima.org"
          git add src/content/blog
          NEWFILE=$(git diff --cached --name-only --diff-filter=A | head -1)
          git commit -m "content: auto-publish $(basename "$NEWFILE" .mdx)"
          git push
