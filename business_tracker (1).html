<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Money Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions */
        .fade-in { animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 pb-20">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 fade-in">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="text-white w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                </div>
                <h1 class="text-2xl font-bold">Business Tracker</h1>
                <p class="text-slate-500 mt-2">Sign in to manage finances</p>
            </div>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" value="admin" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" value="password" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md shadow-blue-200 transition-colors mt-2">
                    Sign In (Demo)
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appScreen" class="hidden fade-in">
        <!-- Navbar -->
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-2 font-bold text-xl">
                    <div class="bg-blue-600 p-1.5 rounded-lg text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                    </div>
                    LedgerPro
                </div>
                <button onclick="logout()" class="text-slate-500 hover:text-slate-800 flex items-center gap-1.5 text-sm font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span class="hidden sm:inline">Sign Out</span>
                </button>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto p-4 space-y-6">
            <!-- Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-sm font-medium mb-2 flex justify-between items-center">
                        Balance <svg class="w-4 h-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                    </p>
                    <h3 id="statBalance" class="text-2xl font-bold text-slate-900">₹0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-sm font-medium mb-2 flex justify-between items-center">
                        Credit <svg class="w-4 h-4 text-emerald-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                    </p>
                    <h3 id="statCredit" class="text-xl md:text-2xl font-bold text-emerald-600">₹0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-sm font-medium mb-2 flex justify-between items-center">
                        Debit <svg class="w-4 h-4 text-rose-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
                    </p>
                    <h3 id="statDebit" class="text-xl md:text-2xl font-bold text-rose-600">₹0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-sm font-medium mb-2 flex justify-between items-center">
                        Records <svg class="w-4 h-4 text-indigo-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    </p>
                    <h3 id="statCount" class="text-xl md:text-2xl font-bold text-indigo-600">0</h3>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex flex-col md:flex-row gap-3 bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                <div class="flex-1 relative">
                    <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" placeholder="Search description or amount..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <select id="filterSelect" class="flex-1 md:flex-none py-2 px-3 bg-slate-50 border border-slate-200 rounded-lg outline-none text-sm font-medium">
                        <option value="All">All Types</option>
                        <option value="Credit">Credit Only</option>
                        <option value="Debit">Debit Only</option>
                    </select>
                    <button onclick="exportCSV()" class="md:flex-none bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-1.5 shadow-sm transition-colors">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        <span class="hidden sm:inline">Export</span>
                    </button>
                    <button onclick="openAddModal()" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-1.5 shadow-sm shadow-blue-200 transition-colors">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-100">
                            <tr class="text-slate-500 text-xs uppercase tracking-wider font-semibold">
                                <th class="p-4 whitespace-nowrap">Date</th>
                                <th class="p-4 whitespace-nowrap">Type</th>
                                <th class="p-4 w-full">Description</th>
                                <th class="p-4 whitespace-nowrap text-right">Amount</th>
                                <th class="p-4 whitespace-nowrap text-right hidden md:table-cell">Balance</th>
                                <th class="p-4 whitespace-nowrap text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100 text-sm">
                            <!-- JS Populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODALS -->
    
    <!-- Add/Edit Modal -->
    <div id="txModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
            <div class="flex justify-between items-center p-5 border-b border-slate-100 bg-slate-50/50">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-900">New Transaction</h3>
                <button onclick="closeModal('txModal')" class="text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100">
                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="txForm" class="p-6 space-y-5">
                <input type="hidden" id="txId">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Type</label>
                    <div class="flex bg-slate-100 p-1 rounded-lg">
                        <button type="button" id="btnCredit" onclick="setTxType('Credit')" class="flex-1 py-2 text-sm font-bold rounded-md bg-white shadow text-emerald-600 transition-all">Credit</button>
                        <button type="button" id="btnDebit" onclick="setTxType('Debit')" class="flex-1 py-2 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition-all">Debit</button>
                    </div>
                    <input type="hidden" id="txType" value="Credit">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                    <input type="text" id="txDesc" required placeholder="e.g. Office Rent" class="w-full border border-slate-200 px-4 py-2.5 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
                        <input type="number" id="txAmount" required min="1" step="any" placeholder="0" class="w-full border border-slate-200 px-4 py-2.5 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                        <input type="date" id="txDate" required class="w-full border border-slate-200 px-4 py-2.5 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                </div>
                <div class="pt-2 flex gap-3">
                    <button type="button" onclick="closeModal('txModal')" class="flex-1 py-2.5 rounded-lg text-slate-600 font-medium hover:bg-slate-100 transition-colors text-sm">Cancel</button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow-sm shadow-blue-200 transition-colors text-sm">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center">
            <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-2">Delete Transaction?</h3>
            <p class="text-slate-500 text-sm mb-6">This action cannot be undone. Are you sure you want to remove this record?</p>
            <input type="hidden" id="deleteId">
            <div class="flex gap-3">
                <button onclick="closeModal('deleteModal')" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg transition-colors text-sm">Cancel</button>
                <button onclick="confirmDelete()" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg shadow-sm shadow-rose-200 transition-colors text-sm">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let transactions = [
            { id: '1', type: 'Credit', description: 'Initial Capital', amount: 150000, date: '2026-06-01' },
            { id: '2', type: 'Debit', description: 'Office Rent - June', amount: 15000, date: '2026-06-02' },
            { id: '3', type: 'Credit', description: 'Client Payment', amount: 45000, date: '2026-06-03' },
            { id: '4', type: 'Debit', description: 'Electricity Bill', amount: 3500, date: '2026-06-04' }
        ];

        // --- Utility Functions ---
        const formatCurrency = (amount) => {
            return '₹' + Number(amount).toLocaleString('en-IN', { maximumFractionDigits: 0 });
        };

        const getToday = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- DOM Elements ---
        const loginScreen = document.getElementById('loginScreen');
        const appScreen = document.getElementById('appScreen');
        const searchInput = document.getElementById('searchInput');
        const filterSelect = document.getElementById('filterSelect');
        const tableBody = document.getElementById('tableBody');

        // --- Auth Logic ---
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            loginScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            renderApp();
        });

        const logout = () => {
            appScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
        };

        // --- Rendering Logic ---
        const renderApp = () => {
            // Calculate totals
            let balance = 0, credit = 0, debit = 0;
            transactions.forEach(t => {
                const amt = Number(t.amount);
                if (t.type === 'Credit') { credit += amt; balance += amt; }
                else { debit += amt; balance -= amt; }
            });

            // Update DOM Stats
            document.getElementById('statBalance').textContent = formatCurrency(balance);
            document.getElementById('statCredit').textContent = formatCurrency(credit);
            document.getElementById('statDebit').textContent = formatCurrency(debit);
            document.getElementById('statCount').textContent = transactions.length;

            // Process Data (Sort, Run Balance, Filter, Search)
            let processed = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            let runBal = 0;
            processed = processed.map(t => {
                runBal = t.type === 'Credit' ? runBal + Number(t.amount) : runBal - Number(t.amount);
                return { ...t, runningBalance: runBal };
            }).reverse();

            const filterVal = filterSelect.value;
            if (filterVal !== 'All') processed = processed.filter(t => t.type === filterVal);

            const searchVal = searchInput.value.toLowerCase();
            if (searchVal) {
                processed = processed.filter(t => 
                    t.description.toLowerCase().includes(searchVal) || 
                    String(t.amount).includes(searchVal)
                );
            }

            // Render Table
            tableBody.innerHTML = '';
            if (processed.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-12 text-center text-slate-500">No transactions found.</td></tr>`;
                return;
            }

            processed.forEach(tx => {
                const typeStyle = tx.type === 'Credit' 
                    ? 'bg-emerald-100 text-emerald-700' 
                    : 'bg-rose-100 text-rose-700';
                const amountStyle = tx.type === 'Credit' ? 'text-emerald-600' : 'text-rose-600';
                const sign = tx.type === 'Credit' ? '+' : '-';

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/50 transition-colors border-b border-slate-50 last:border-0';
                tr.innerHTML = `
                    <td class="p-4 text-slate-600 whitespace-nowrap">${tx.date}</td>
                    <td class="p-4 whitespace-nowrap"><span class="inline-flex px-2.5 py-1 rounded-full text-xs font-bold ${typeStyle}">${tx.type}</span></td>
                    <td class="p-4 text-slate-900 font-medium">${tx.description}</td>
                    <td class="p-4 whitespace-nowrap text-right font-bold ${amountStyle}">${sign}${formatCurrency(tx.amount)}</td>
                    <td class="p-4 whitespace-nowrap text-right text-slate-500 font-medium hidden md:table-cell">${formatCurrency(tx.runningBalance)}</td>
                    <td class="p-4 whitespace-nowrap text-center">
                        <button onclick="openEditModal('${tx.id}')" class="text-slate-400 hover:text-blue-600 p-1.5 mx-1 rounded hover:bg-blue-50 transition-colors">
                            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                        </button>
                        <button onclick="requestDelete('${tx.id}')" class="text-slate-400 hover:text-rose-600 p-1.5 mx-1 rounded hover:bg-rose-50 transition-colors">
                            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        };

        // Listeners for Search and Filter
        searchInput.addEventListener('input', renderApp);
        filterSelect.addEventListener('change', renderApp);

        // --- Modal Logic ---
        const closeModal = (id) => document.getElementById(id).classList.add('hidden');
        const openModal = (id) => document.getElementById(id).classList.remove('hidden');

        const setTxType = (type) => {
            document.getElementById('txType').value = type;
            const btnCredit = document.getElementById('btnCredit');
            const btnDebit = document.getElementById('btnDebit');
            
            if (type === 'Credit') {
                btnCredit.className = 'flex-1 py-2 text-sm font-bold rounded-md bg-white shadow text-emerald-600 transition-all';
                btnDebit.className = 'flex-1 py-2 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition-all';
            } else {
                btnDebit.className = 'flex-1 py-2 text-sm font-bold rounded-md bg-white shadow text-rose-600 transition-all';
                btnCredit.className = 'flex-1 py-2 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition-all';
            }
        };

        const openAddModal = () => {
            document.getElementById('modalTitle').textContent = 'New Transaction';
            document.getElementById('txId').value = '';
            setTxType('Credit');
            document.getElementById('txDesc').value = '';
            document.getElementById('txAmount').value = '';
            document.getElementById('txDate').value = getToday();
            openModal('txModal');
        };

        const openEditModal = (id) => {
            const tx = transactions.find(t => t.id === id);
            if (!tx) return;
            document.getElementById('modalTitle').textContent = 'Edit Transaction';
            document.getElementById('txId').value = tx.id;
            setTxType(tx.type);
            document.getElementById('txDesc').value = tx.description;
            document.getElementById('txAmount').value = tx.amount;
            document.getElementById('txDate').value = tx.date;
            openModal('txModal');
        };

        document.getElementById('txForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('txId').value || generateId();
            const type = document.getElementById('txType').value;
            const desc = document.getElementById('txDesc').value;
            const amount = Number(document.getElementById('txAmount').value);
            const date = document.getElementById('txDate').value;

            const existingIndex = transactions.findIndex(t => t.id === id);
            const newTx = { id, type, description: desc, amount, date };

            if (existingIndex >= 0) {
                transactions[existingIndex] = newTx;
            } else {
                transactions.push(newTx);
            }

            closeModal('txModal');
            renderApp();
        });

        const requestDelete = (id) => {
            document.getElementById('deleteId').value = id;
            openModal('deleteModal');
        };

        const confirmDelete = () => {
            const id = document.getElementById('deleteId').value;
            transactions = transactions.filter(t => t.id !== id);
            closeModal('deleteModal');
            renderApp();
        };

        // --- Export CSV ---
        const exportCSV = () => {
            let processed = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            let runBal = 0;
            processed = processed.map(t => {
                runBal = t.type === 'Credit' ? runBal + Number(t.amount) : runBal - Number(t.amount);
                return { ...t, runningBalance: runBal };
            });

            const headers = ['Date', 'Type', 'Description', 'Amount', 'Running Balance'];
            const csvContent = [
                headers.join(','),
                ...processed.map(t => `${t.date},${t.type},"${t.description.replace(/"/g, '""')}",${t.amount},${t.runningBalance}`)
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `transactions_${getToday()}.csv`;
            link.click();
        };

    </script>
</body>
</html>
